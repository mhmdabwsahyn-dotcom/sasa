function hol(t){
 const b=$("#hol"),n0=new Date();n0.setHours(0,0,0,0);b.style.display="none";
 for(const[s,i,d]of HOL){const a=new Date(s+"T00:00:00"),e=new Date(a);e.setDate(e.getDate()+d);
  if(e<=n0)continue;const x=Math.ceil((a-n0)/864e5);if(x>90)return;
  const k=x<=0?t.hb[2]:t.hb[1].replace("{x}",x),ds=new Intl.DateTimeFormat(LOC[lang],{day:"numeric",month:"long",year:"numeric"}).format(a);
  b.textContent=t.hb[0].replace("{n}",t.hn[i]).replace("{d}",ds).replace("{k}",k);b.style.display="block";return}
}

 ["#gw","#gw2","#fw"].forEach(s=>$(s).href=wl(t.gm));

 document.querySelectorAll("[data-n]").forEach(e=>{const N=+e.dataset.n,T=performance.now();
